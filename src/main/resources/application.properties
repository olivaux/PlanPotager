spring.application.name=PlanPotager
server.port=${SERVER_PORT:8080}

# Profil local (application-local.properties, non versionné) pour les secrets de dev (OAuth2 Google, etc.)
# Profil dev (application-dev.properties) : confort de développement (logs SQL). En production, définir
# SPRING_PROFILES_ACTIVE sans local ni dev.
spring.profiles.active=local,dev

# Datasource (matches compose.yaml for local dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:13306/mydatabase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is created manually via sql/structure.sql (docker-entrypoint-initdb.d), not by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use explicit @Table/@Column names verbatim (LDD uses mixed-case identifiers) instead of Spring's
# default snake_case/lowercase physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Pas de session JPA ouverte pendant toute la requete HTTP : l'acces aux entites passe par les @Transactional des services
spring.jpa.open-in-view=false
# Logs SQL : uniquement dans le profil dev (application-dev.properties), jamais en production

# Spring Boot auto-starts compose.yaml services in dev (spring-boot-docker-compose)
spring.docker.compose.enabled=true

# OAuth2 (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Redirection après login réussi.
app.oauth2-success-url=http://localhost:5173/profile

